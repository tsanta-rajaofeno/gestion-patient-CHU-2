<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion des Patients</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="logo_chu.jpg" type="image/x-icon" />
  </head>
  <body>
    <!-- En-tête supérieur statique : Recherche + Panneau de filtrage dynamique -->
    <div class="top-sticky-header">
      <input
        type="text"
        id="searchInput"
        onkeyup="searchTable()"
        placeholder="Rechercher un patient..."
      />
      <div class="sql-buttons-container">
        <button onclick="chargerPatients()" style="padding: 8px">
          Afficher tout (Read)
        </button>

        <!-- NOUVEAU PANNEAU DE FILTRAGE DYNAMIQUE -->
        <div class="filter-panel">
          <select id="critereFiltre">
            <option value="age">Par Âge</option>
            <option value="sejours">Par Séjour (jours)</option>
          </select>

          <select id="operateurFiltre">
            <option value="superieur">Supérieur à (>)</option>
            <option value="inferieur">Inférieur à (<)</option>
          </select>

          <input type="number" id="valeurFiltre" placeholder="ex: 25" />

          <button onclick="appliquerFiltreDynamique()" class="btn-filter">
            Filtrer
          </button>
        </div>

        <button onclick="chargerStats()" style="padding: 8px">
          Statistiques (Moyenne / Total)
        </button>
        <a class="accueil" href="accueil.html" style="display: inline-block; margin-left: 10px;">Page d'Accueil</a>
      </div>
    </div>

    <div class="flex-container">
      <table id="patientTable">
        <thead>
          <tr>
            <td class="left">
              <form
                onsubmit="
                  event.preventDefault();
                  onFormsubmit();
                "
                autocomplete="off"
                id="patientForm"
              >
                <!-- CHAMP AFFECTATION STRUCTURÉ (CHU ANDRAINJATO) -->
                <div>
                  <label for="bloc">Affectation :</label>
                  <select name="bloc" id="bloc" required>
                    <option value="">-- Sélectionner l'affectation --</option>
                    
                    <optgroup label="Bloc Public (Salles A1 - A8)">
                      <option value="A1">Salle A1</option>
                      <option value="A2">Salle A2</option>
                      <option value="A3">Salle A3</option>
                      <option value="A4">Salle A4</option>
                      <option value="A5">Salle A5</option>
                      <option value="A6">Salle A6</option>
                      <option value="A7">Salle A7</option>
                      <option value="A8">Salle A8</option>
                    </optgroup>

                    <optgroup label="Bloc Privé (Chambres B1 - B6)">
                      <option value="B1">Chambre Privée B1</option>
                      <option value="B2">Chambre Privée B2</option>
                      <option value="B3">Chambre Privée B3</option>
                      <option value="B4">Chambre Privée B4</option>
                      <option value="B5">Chambre Privée B5</option>
                      <option value="B6">Chambre Privée B6</option>
                    </optgroup>

                    <optgroup label="Cabinets de Consultation">
                      <option value="Porte 1">Cabinet - Porte 1</option>
                      <option value="Porte 2">Cabinet - Porte 2</option>
                      <option value="Porte 3">Cabinet - Porte 3</option>
                      <option value="Porte 4">Cabinet - Porte 4</option>
                    </optgroup>
                  </select>
                </div>

                <div>
                  <label for="nom">Nom:</label>
                  <input
                    type="text"
                    name="nom"
                    id="nom"
                    placeholder="RAKOTO"
                    required
                  />
                </div>

                <div>
                  <label for="prenom">Prénom:</label>
                  <input
                    type="text"
                    name="prenom"
                    id="prenom"
                    placeholder="Rakoto"
                    required
                  />
                </div>

                <div>
                  <label for="age">Age:</label>
                  <input
                    type="number"
                    name="age"
                    id="age"
                    placeholder="30"
                    required
                  />
                </div>

                <div>
                  <label for="addresse">Adresse:</label>
                  <input
                    type="text"
                    name="addresse"
                    id="addresse"
                    placeholder="Quartier Ville"
                    required
                  />
                </div>

                <div>
                  <label for="maladie">Maladie:</label>
                  <input
                    type="text"
                    name="maladie"
                    id="maladie"
                    placeholder="Maladie"
                    required
                  />
                </div>

                <div>
                  <label for="phone">Téléphone:</label>
                  <input
                    type="tel"
                    name="phone"
                    id="phone"
                    placeholder="0340000000"
                    required
                  />
                </div>

                <div>
                  <label for="date_entree">Date d'entrée:</label>
                  <input
                    type="date"
                    name="date_entree"
                    id="date_entree"
                    required
                  />
                </div>

                <div>
                  <label for="sejours">Séjours éstimés(jours):</label>
                  <input
                    type="number"
                    name="sejours"
                    id="sejours"
                    placeholder="5"
                    required
                  />
                </div>

                <div>
                  <label for="sex">Sexe:</label>
                  <select name="sex" id="sex" required>
                    <option value="">Selectionner Sexe</option>
                    <option value="M">M</option>
                    <option value="F">F</option>
                  </select>
                </div>

                <div class="form-action-buttons">
                  <input type="submit" value="Enregistrer" />
                </div>
              </form>
            </td>

            <td class="right">
              <table class="list" id="patient_liste">
                <thead>
                  <tr>
                    <th>Bloc</th>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Age</th>
                    <th>Adresse</th>
                    <th>Maladie</th>
                    <th>Téléphone</th>
                    <th>D/E</th>
                    <th>S/E(j)</th>
                    <th>Sexe</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  <!-- Les patients seront ajoutés ici dynamiquement -->
                </tbody>
              </table>
            </td>
          </tr>
        </thead>
      </table>
      <div class="language">
        <a href="index.html">Fr</a> | <a href="index_en.html">En</a>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
