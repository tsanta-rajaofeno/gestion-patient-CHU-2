<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion des Patients</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="logo_chu.jpg" type="image/x-icon" />
  </head>
  <body>
    <div class="flex-container">
      <table id="patientTable">
        <thead>
          <tr>
            <td class="left">
              <form
                onsubmit="
                  event.preventDefault();
                  onFormsubmit();
                "
                autocomplete="off"
                id="patientForm"
              >
                <div>
                  <label for="nom">Nom:</label>
                  <input
                    type="text"
                    name="nom"
                    id="nom"
                    placeholder="Nom"
                    required
                  />
                </div>

                <div>
                  <label for="prenom">Prénom:</label>
                  <input
                    type="text"
                    name="prenom"
                    id="prenom"
                    placeholder="Prénom"
                    required
                  />
                </div>

                <div>
                  <label for="age">Age:</label>
                  <input
                    type="number"
                    name="age"
                    id="age"
                    placeholder="Age"
                    required
                  />
                </div>

                <div>
                  <label for="addresse">Adresse:</label>
                  <input
                    type="text"
                    name="addresse"
                    id="addresse"
                    placeholder="Adresse"
                    required
                  />
                </div>

                <div>
                  <label for="maladie">Maladie:</label>
                  <input
                    type="text"
                    name="maladie"
                    id="maladie"
                    placeholder="Maladie"
                    required
                  />
                </div>

                <div>
                  <label for="phone">Téléphone:</label>
                  <input
                    type="tel"
                    name="phone"
                    id="phone"
                    placeholder="Téléphone"
                    required
                  />
                </div>

                <div>
                  <label for="date_entree">Date d'entrée:</label>
                  <input
                    type="date"
                    name="date_entree"
                    id="date_entree"
                    required
                  />
                </div>

                <div>
                  <label for="sejours">Séjours éstimé(jours):</label>
                  <input
                    type="number"
                    name="sejours"
                    id="sejours"
                    placeholder="5"
                    required
                  />
                </div>

                <div>
                  <label for="sex">Sexe:</label>
                  <select name="sex" id="sex" required>
                    <option value="">Selectionner Sexe</option>
                    <option value="M">M</option>
                    <option value="F">F</option>
                  </select>
                </div>

                <div class="form-action-buttons">
                  <input type="submit" value="Enregistrer" />
                </div>
              </form>
            </td>

            <td class="right">
              <table class="list" id="patient_liste">
                <thead>
                  <tr>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Age</th>
                    <th>Adresse</th>
                    <th>Maladie</th>
                    <th>Téléphone</th>
                    <th>S/E(j)</th>
                    <th>D/E</th>
                    <th>Sexe</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  <!-- Les patients seront ajoutés ici dynamiquement -->
                </tbody>
              </table>
            </td>
          </tr>
        </thead>
      </table>
      <div class="language">
        <a href="index.html">Fr</a> | <a href="index_en.html">En</a>
      </div>
    </div>

    <input
      type="text"
      id="searchInput"
      onkeyup="searchTable()"
      placeholder="Rechercher un patient..."
    />
    <script src="script.js"></script>
    <!-- Boutons demandés par le sujet pour les requêtes SQL -->
    <div style="margin: 15px 0">
      <button onclick="chargerPatients()" style="padding: 8px">
        Afficher tout (Read)
      </button>
      <button onclick="chargerFiltre3Conditions()" style="padding: 8px">
        Filtrer (3 Conditions)
      </button>
      <button onclick="chargerStats()" style="padding: 8px">
        Statistiques (Moyenne / Total)
      </button>
    </div>

    <a class="accueil" href="accueil.html">Page d'Accueil</a>
  </body>
</html>
