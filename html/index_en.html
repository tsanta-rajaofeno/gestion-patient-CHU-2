<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion des Patients</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" href="../photos/logo_chu.jpg" type="image/x-icon" />
  </head>
  <body>
    <!-- Static Top Header -->
    <div class="top-sticky-header">
      <input
        type="text"
        id="searchInput"
        onkeyup="searchTable()"
        placeholder="Find a patient..."
      />
      <div class="sql-buttons-container">
        <button onclick="chargerPatients()" style="padding: 8px">
          Display all
        </button>

        <!-- DYNAMIC FILTER PANEL -->
        <div class="filter-panel">
          <select id="critereFiltre">
            <option value="age">By Age</option>
            <option value="sejours">By Stay (days)</option>
          </select>

          <select id="operateurFiltre">
            <option value="superieur">Greater than (>)</option>
            <option value="inferieur">Less than (<)</option>
          </select>

          <input
            type="number"
            id="valeurFiltre"
            placeholder="ex: 25"
            min="0"
            step="1"
            onkeydown="blockNonIntegers(event)"
            oninput="sanitizeIntegerInput(this)"
          />

          <button onclick="appliquerFiltreDynamique()" class="btn-filter">
            Filter
          </button>
        </div>

        <button onclick="chargerStats()" style="padding: 8px">
          Statistics (Average / Total)
        </button>
        <a
          class="accueil"
          href="../html/accueil.html"
          style="display: inline-block; margin-left: 10px"
          >Home Page</a
        >
      </div>
    </div>

    <div class="flex-container">
      <table id="patientTable">
        <thead>
          <tr>
            <td class="left">
              <form
                onsubmit="
                  event.preventDefault();
                  onFormsubmit();
                "
                autocomplete="off"
                id="patientForm"
              >
                <!-- ASSIGNMENT SELECT -->
                <div>
                  <label for="bloc">Assignment:</label>
                  <select name="bloc" id="bloc" required>
                    <option value="">-- Select Assignment --</option>

                    <optgroup label="Public Ward (Wards A1 - A8) - 6 MAX">
                      <option value="A1">Ward A1</option>
                      <option value="A2">Ward A2</option>
                      <option value="A3">Ward A3</option>
                      <option value="A4">Ward A4</option>
                      <option value="A5">Ward A5</option>
                      <option value="A6">Ward A6</option>
                      <option value="A7">Ward A7</option>
                      <option value="A8">Ward A8</option>
                    </optgroup>

                    <optgroup label="Private Block (Rooms B1 - B6) - 1 MAX">
                      <option value="B1">Private Room B1</option>
                      <option value="B2">Private Room B2</option>
                      <option value="B3">Private Room B3</option>
                      <option value="B4">Private Room B4</option>
                      <option value="B5">Private Room B5</option>
                      <option value="B6">Private Room B6</option>
                    </optgroup>

                    <optgroup label="Consultation Offices - 20 MAX">
                      <option value="Porte 1">Office - Door 1</option>
                      <option value="Porte 2">Office - Door 2</option>
                      <option value="Porte 3">Office - Door 3</option>
                      <option value="Porte 4">Office - Door 4</option>
                    </optgroup>
                  </select>
                </div>

                <div>
                  <label for="nom">Last Name:</label>
                  <input
                    type="text"
                    name="nom"
                    id="nom"
                    placeholder="RAKOTO"
                    required
                  />
                </div>

                <div>
                  <label for="prenom">First Name:</label>
                  <input
                    type="text"
                    name="prenom"
                    id="prenom"
                    placeholder="Rakoto"
                    required
                  />
                </div>

                <div>
                  <label for="age">Age:</label>
                  <input
                    type="number"
                    name="age"
                    id="age"
                    placeholder="30"
                    required
                  />
                </div>

                <div>
                  <label for="addresse">Address:</label>
                  <input
                    type="text"
                    name="addresse"
                    id="addresse"
                    placeholder="Neightborhood City"
                    required
                  />
                </div>

                <div>
                  <label for="maladie">Disease:</label>
                  <input
                    type="text"
                    name="maladie"
                    id="maladie"
                    placeholder="Disease"
                    required
                  />
                </div>

                <div>
                  <label for="phone">Phone:</label>
                  <input
                    type="tel"
                    name="phone"
                    id="phone"
                    placeholder="0340000000"
                    required
                  />
                </div>

                <div>
                  <label for="date_entree">Entry Date:</label>
                  <input
                    type="date"
                    name="date_entree"
                    id="date_entree"
                    required
                  />
                </div>

                <div>
                  <label for="sejours">Estimated Stays (days):</label>
                  <input
                    type="number"
                    name="sejours"
                    id="sejours"
                    placeholder="5"
                    required
                  />
                </div>

                <div>
                  <label for="sex">Sex:</label>
                  <select name="sex" id="sex" required>
                    <option value="">Select Sex</option>
                    <option value="M">M</option>
                    <option value="F">F</option>
                  </select>
                </div>

                <div class="form-action-buttons">
                  <input type="submit" value="Save" />
                </div>
              </form>
            </td>

            <td class="right">
              <table class="list" id="patient_liste">
                <thead>
                  <tr>
                    <th>Box</th>
                    <th>Last Name</th>
                    <th>First Name</th>
                    <th>Age</th>
                    <th>Address</th>
                    <th>Disease</th>
                    <th>Phone</th>
                    <th>E/D</th>
                    <th>E/S(d)</th>
                    <th>Sex</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  <!-- Les patients seront ajoutés ici dynamiquement -->
                </tbody>
              </table>
            </td>
          </tr>
        </thead>
      </table>
      <div class="language">
        <a href="../html/index.html">Fr</a> |
        <a href="../html/index_en.html">En</a>
      </div>
    </div>

    <script src="../js/script_en.js"></script>
  </body>
</html>
